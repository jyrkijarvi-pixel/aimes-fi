<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aimes Office – small steps and important stamps</title><meta name="description" content="A local task list, break timer and bureaucratic humour. Take one small step. No account needed."><link rel="canonical" href="https://aimes.fi/en/toimisto/"><link rel="alternate" hreflang="fi" href="https://aimes.fi/toimisto/"><link rel="alternate" hreflang="en" href="https://aimes.fi/en/toimisto/"><link rel="stylesheet" href="/toimisto/office.css"><script defer src="/toimisto/office.js"></script></head><body>
<div class="topline" data-t="top"></div><div class="wrap"><header class="masthead"><a class="brand" href="/en/"><span class="seal">✳</span><span class="brand-text">aimes.fi<br><span data-t="office"></span></span></a><nav aria-label="Navigation"><a href="/en/" data-t="home"></a><a href="#action-desk" data-t="tasks"></a><a href="#application-section" data-t="paperwork"></a><a class="language" lang="fi" href="/toimisto/" >FI</a><a class="language" lang="en" href="/en/toimisto/" aria-current="page">EN</a></nav></header>
<main><section class="hero"><div><div class="eyebrow" data-t="eyebrow"></div><h1 data-t="hero"></h1><p class="lead" data-t="lead"></p><div class="buttons"><a class="button primary" href="#action-desk" data-t="begin"></a><button class="button" id="panic" data-t="emergency"></button></div><p class="fine" data-t="free"></p></div></section>
<section class="section useful" id="action-desk" aria-labelledby="desk-title"><div class="section-top"><h2 id="desk-title" data-t="desk"></h2><span data-t="department"></span></div><p class="desk-intro" data-t="intro"></p><div class="desk-grid">
<article class="desk-card"><span class="eyebrow" data-t="one"></span><h3 data-t="clear"></h3><form id="task-form"><label for="task-title" data-t="taskLabel"></label><input id="task-title" maxlength="160" required autocomplete="off"><div class="task-options"><div><label for="task-priority" data-t="priority"></label><select id="task-priority"><option value="2" data-t="normal"></option><option value="3" data-t="important"></option><option value="1" data-t="whenever"></option></select></div><div><label for="task-size" data-t="effort"></label><select id="task-size"><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60" data-t="hour"></option></select></div></div><button class="button primary" data-t="add"></button></form><p id="task-summary" role="status"></p><ul id="task-list" class="task-list"></ul><label class="remember"><input type="checkbox" id="remember-tasks"><span data-t="remember"></span></label><p class="fine" id="save-note"></p><div class="buttons"><button class="button" id="export-tasks" data-t="download"></button><button class="button" id="clear-done" data-t="clearDone"></button></div></article>
<article class="desk-card mint-card"><span class="eyebrow" data-t="two"></span><h3 data-t="badly"></h3><p data-t="sort"></p><button class="button" id="choose-task" data-t="choose"></button><div class="next-task" aria-live="polite"><span class="form-label" data-t="yourOne"></span><p id="chosen-task"></p><p id="first-step" data-t="smallExcuse"></p></div><label for="starter-type" data-t="stuck"></label><select id="starter-type"><option value="general" data-t="general"></option><option value="writing" data-t="writing"></option><option value="tidying" data-t="tidying"></option><option value="learning" data-t="learning"></option><option value="coding" data-t="coding"></option></select><button class="button primary" id="start-tiny" data-t="tiny"></button><button class="button" id="complete-chosen" data-t="done"></button><p class="fine" data-t="counts"></p></article>
<article class="desk-card yellow-card"><span class="eyebrow" data-t="three"></span><h3 data-t="maintenance"></h3><label for="timer-mode" data-t="authorise"></label><select id="timer-mode"><option value="120" data-t="mode120"></option><option value="300" data-t="mode300"></option><option value="600" data-t="mode600"></option><option value="1500" data-t="mode1500"></option></select><p id="timer-purpose"></p><div id="desk-clock" class="desk-clock" role="timer" aria-label="Time remaining">02:00</div><p id="timer-status" role="status"></p><div class="buttons"><button class="button primary" id="timer-start"></button><button class="button" id="timer-pause" data-t="pause"></button><button class="button" id="timer-reset" data-t="reset"></button></div><p class="fine" data-t="timerNote"></p><div class="break-order"><strong data-t="breakOrder"></strong><p id="break-tip"></p><button class="button" id="new-break" data-t="another"></button></div></article></div></section>
<section class="section" id="application-section"><div class="section-top"><h2 data-t="formTitle"></h2><span data-t="notAuthority"></span></div><div class="forms"><form class="application" id="application"><label for="name" data-t="name"></label><input id="name" maxlength="80" autocomplete="off"><label for="topic" data-t="topic"></label><select id="topic"><option value="nothing" data-t="nothing"></option><option value="coffee" data-t="coffee"></option><option value="tomorrow" data-t="tomorrow"></option><option value="nap" data-t="nap"></option><option value="idea" data-t="idea"></option><option value="fridge" data-t="fridge"></option><option value="flirt" data-t="flirt"></option></select><fieldset class="urgency"><legend data-t="urgency"></legend><div class="choices"><label><input type="radio" name="urgency" value="normal" checked><span data-t="noRush"></span></label><label><input type="radio" name="urgency" value="urgent"><span data-t="busy"></span></label></div></fieldset><button class="button primary" data-t="submit"></button><p class="fine" data-t="privateForm"></p></form><article class="decision" id="decision" aria-live="polite"><div class="meta" id="caseNumber" data-t="decisionDesk"></div><h3 id="decisionTitle" data-t="decisionTitle"></h3><p id="decisionBody" data-t="decisionBody"></p><span class="stamp" id="stamp" data-t="awaiting"></span><small id="decisionFoot" data-t="noLegal"></small><button class="button" id="printDecision" hidden data-t="print"></button></article></div></section>
<section class="section duo" id="excuses-section"><article class="excuse"><span class="eyebrow" data-t="excuseService"></span><blockquote id="excuse"></blockquote><button class="button" id="newExcuse" data-t="better"></button></article><article class="coffee" id="coffee-section"><div class="cup" id="cup" aria-hidden="true"></div><h3 data-t="coffeeTitle"></h3><p id="coffeeText" data-t="coffeeText"></p><button class="button" id="coffeeButton" data-t="runMaintenance"></button></article></section>
<section class="bottom-fun"><div><h3 data-t="queueTitle"></h3><p data-t="queueIntro"></p><div class="queue"><span class="queue-number" id="queueNumber">—</span><button class="button" id="takeNumber" data-t="number"></button><button class="button" id="express" data-t="express"></button></div><p id="queueNotice" role="status"></p></div><aside class="about"><strong data-t="noticeTitle"></strong><span data-t="notice"></span></aside></section></main><footer><a href="/en/">aimes.fi</a><span data-t="footer"></span><button id="lastButton" data-t="feedback"></button></footer></div><div id="toast" class="toast" role="status" hidden></div></body></html>
